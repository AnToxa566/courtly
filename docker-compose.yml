services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: courtly
      POSTGRES_PASSWORD: courtly
      POSTGRES_DB: courtly
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      # TCP on 127.0.0.1: the init phase only listens on the unix socket, so
      # this passes only once init scripts have finished.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U courtly -d courtly']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
